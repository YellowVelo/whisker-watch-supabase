name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: @supabase/supabase-js's realtime client needs
          # native WebSocket support, stable in Node 22+ (Node 20 throws
          # at client-construction time without a polyfill).
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Re-enabled 2026-08-04 (spec 0044): the 308 pre-existing errors that
      # blocked this since 2026-07-21 are fixed. See
      # docs/features/0044_Typecheck_Cleanup_And_CI_Gate_Specification_v1.md.
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # These tests call the already-deployed Edge Functions on
    # wysker-watch-dev over HTTP (see supabase/functions/_shared/testHelpers.ts)
    # — they are never run against production. Deploy the target function
    # to wysker-watch-dev before merging a change to it, same as any other
    # manual deploy step today.
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run delete-pet / delete-account integration tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          # sb_publishable / sb_secret: repo secret names as actually
          # created (Supabase's newer publishable/secret key format, not
          # the legacy anon/service_role JWTs — see testHelpers.ts, both
          # work with supabase-js's createClient() regardless of format).
          SUPABASE_ANON_KEY: ${{ secrets.sb_publishable }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.sb_secret }}
          TEST2_EMAIL: ${{ secrets.SUPABASE_DEV_TEST2_EMAIL }}
          TEST2_PASSWORD: ${{ secrets.SUPABASE_DEV_TEST2_PASSWORD }}
        run: |
          deno test --allow-net --allow-env --node-modules-dir=none \
            supabase/functions/delete-pet/index.test.ts \
            supabase/functions/delete-account/index.test.ts

      - name: Run save_daily_check_ins integration tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.sb_publishable }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.sb_secret }}
        run: |
          deno test --allow-net --allow-env --node-modules-dir=none \
            supabase/tests/save_daily_check_ins.test.ts

      - name: Run resend-webhook integration tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEV_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.sb_publishable }}
          # Legacy-JWT-format service_role credential for wysker-watch-dev
          # (not the opaque sb_secret_ key used elsewhere) — send-email and
          # clear-email-suppression's auth check decodes a `role` claim off
          # this token (see their header comments on getJwtRole), which the
          # opaque key format can't provide. See index.test.ts's header
          # comment for the full history/caveat this resolves.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_LEGACY_JWT_SECRET }}
          TEST2_EMAIL: ${{ secrets.SUPABASE_DEV_TEST2_EMAIL }}
          TEST2_PASSWORD: ${{ secrets.SUPABASE_DEV_TEST2_PASSWORD }}
          # Must match the RESEND_WEBHOOK_SECRET configured on
          # wysker-watch-dev's resend-webhook function — a test value,
          # Resend itself is never involved in these tests.
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
        run: |
          deno test --allow-net --allow-env --node-modules-dir=none \
            supabase/functions/resend-webhook/index.test.ts
