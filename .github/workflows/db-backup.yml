name: Database Backup

on:
  schedule:
    # 08:00 UTC daily (~3-4am US Eastern depending on DST)
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Sentry Cron monitor check-in address (spec 0084, FR7/FR8). Optional:
      # if unset, or Sentry can't be reached, the backup runs exactly as before.
      # Never echo this value to the log.
      SENTRY_CRON_URL: ${{ secrets.SENTRY_CRON_URL }}
    steps:
      - name: 'Sentry check-in: in progress'
        env:
          CHECKIN_STATUS: in_progress
        run: |
          if [ -n "$SENTRY_CRON_URL" ]; then
            # Works with or without a trailing '/' and with an existing query string.
            case "$SENTRY_CRON_URL" in
              *\?*) url="${SENTRY_CRON_URL}&" ;;
              *) url="${SENTRY_CRON_URL%/}/?" ;;
            esac
            curl -fsS --max-time 10 -o /dev/null "${url}status=${CHECKIN_STATUS}" || true
          fi

      - uses: actions/checkout@v4

      - name: Install postgresql-client 17
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Run backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: bash scripts/backup-db.sh

      # Runs after success, failure or a step timeout. If the whole job hits
      # timeout-minutes and GitHub cancels it before this step can finish,
      # Sentry's monitor max-runtime / missed-check-in detection reports it.
      - name: 'Sentry check-in: result'
        if: always()
        env:
          CHECKIN_STATUS: ${{ job.status == 'success' && 'ok' || 'error' }}
        run: |
          if [ -n "$SENTRY_CRON_URL" ]; then
            # Works with or without a trailing '/' and with an existing query string.
            case "$SENTRY_CRON_URL" in
              *\?*) url="${SENTRY_CRON_URL}&" ;;
              *) url="${SENTRY_CRON_URL%/}/?" ;;
            esac
            curl -fsS --max-time 10 -o /dev/null "${url}status=${CHECKIN_STATUS}" || true
          fi
